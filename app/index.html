<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Volume over CEC</title>
<style>
  html,body{margin:0;height:100%;background:#0e0e10;color:#e8e8ea;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .wrap{max-width:980px;margin:0 auto;padding:72px 64px}
  h1{font-size:48px;font-weight:650;margin:0 0 6px}
  .sub{font-size:22px;color:#9a9aa2;margin:0 0 40px}
  .card{background:#17171b;border:1px solid #26262c;border-radius:16px;padding:36px 40px}
  .statusrow{display:flex;align-items:center;gap:18px;font-size:34px}
  .dot{width:20px;height:20px;border-radius:50%;background:#6b6b73}
  .dot.on{background:#3fbf5f}.dot.off{background:#c14b4b}
  .btns{margin-top:34px;display:flex;gap:22px}
  button{font-size:30px;padding:20px 40px;border-radius:12px;border:0;color:#fff;cursor:pointer;outline:none}
  button:focus{box-shadow:0 0 0 4px #4f7cff}
  .go{background:#2f6bff}.stop{background:#3a3a42}
  .note{font-size:20px;color:#8a8a92;line-height:1.5;margin-top:24px}
  code{background:#000;padding:2px 8px;border-radius:6px;color:#cfe3ff}
  #log{font-size:18px;color:#7d7d86;white-space:pre-wrap;margin-top:18px;min-height:26px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Volume over CEC</h1>
  <p class="sub">Re-enables Apple TV volume control over HDMI-CEC on TV speakers.</p>
  <div class="card">
    <div class="statusrow"><span id="dot" class="dot"></span><span id="status">Checking&hellip;</span></div>
    <div class="btns">
      <button id="enable" class="go">Enable</button>
      <button id="disable" class="stop">Disable</button>
    </div>
    <div id="log"></div>
    <div class="note">On the Apple TV set <b>Settings &rsaquo; Remotes and Devices &rsaquo;
      Volume Control &rsaquo; HDMI</b>. Requires a rooted TV with the Homebrew Channel.</div>
  </div>
</div>
<script>
var APP="/media/developer/apps/usr/palm/applications/org.webosbrew.cecvold";
var HOOK="/var/lib/webosbrew/init.d/cecvold";
function luna(uri,params,cb){try{var b=new PalmServiceBridge();
  b.onservicecallback=function(s){var r;try{r=JSON.parse(s);}catch(e){r={raw:s};}cb&&cb(r);};
  b.call(uri,JSON.stringify(params||{}));}catch(e){cb&&cb({returnValue:false,error:String(e)});}}
function rootExec(cmd,cb){luna("luna://org.webosbrew.hbchannel.service/exec",{command:cmd},function(r){
  cb(r.returnValue!==false,String(r.stdoutString||r.stdout||r.output||r.raw||""));});}
function setStatus(on){document.getElementById("dot").className="dot "+(on?"on":"off");
  document.getElementById("status").textContent=on?"Running":"Stopped";}
function refresh(){rootExec("pidof cecvold >/dev/null 2>&1 && echo RUNNING || echo STOPPED",function(ok,out){
  if(!ok){document.getElementById("status").textContent="Homebrew Channel service not reachable";return;}
  setStatus(out.indexOf("RUNNING")>=0);});}
function log(m){document.getElementById("log").textContent=m;}
document.getElementById("enable").onclick=function(){log("Enabling\u2026");
  var cmd='chmod +x '+APP+'/cecvold; NODE=$('+APP+'/cecvold --autodetect 2>/dev/null | tail -1); '
    +'[ -n "$NODE" ] || NODE=/dev/input/event4; mkdir -p /var/lib/webosbrew/init.d && '
    +'cp '+APP+'/cecvold.hook '+HOOK+' && sed -i "s|^EMIT_NODE=.*|EMIT_NODE=$NODE|" '+HOOK+' && '
    +'chmod +x '+HOOK+' && sh '+HOOK+' && echo "node=$NODE"';
  rootExec(cmd,function(ok,out){log(ok?("Enabled. "+out):("Failed: "+out));setTimeout(refresh,800);});};
document.getElementById("disable").onclick=function(){log("Disabling\u2026");
  rootExec("rm -f "+HOOK+"; kill $(pidof cecvold) 2>/dev/null; true",function(ok,out){
    log(ok?"Disabled.":("Failed: "+out));setTimeout(refresh,600);});};
document.addEventListener("keydown",function(e){if(e.keyCode===461)window.close();});
refresh();
</script>
</body>
</html>
