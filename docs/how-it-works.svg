<svg viewBox="0 0 1700 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="78%" cy="-12%" r="120%">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="60%" stop-color="#0d0e11"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a6abb4"/>
    </marker>
    <marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6f78"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1700" height="640" rx="26" fill="url(#bgGrad)"/>

  <!-- brand -->
  <g>
    <rect x="56" y="95" width="4" height="9"  rx="1" fill="#f5f6f8" opacity="0.5"/>
    <rect x="63" y="90" width="4" height="14" rx="1" fill="#f5f6f8" opacity="0.5"/>
    <rect x="70" y="86" width="4" height="18" rx="1" fill="#f5f6f8"/>
    <rect x="77" y="82" width="4" height="22" rx="1" fill="#f5f6f8"/>
    <text x="92" y="101" font-size="20" font-weight="600" fill="#f5f6f8">Volume over CEC</text>
  </g>

  <!-- source card -->
  <rect x="56" y="370" width="220" height="110" rx="18" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="166" y="416" font-size="25" font-weight="600" fill="#f5f6f8" text-anchor="middle">Apple TV</text>
  <text x="166" y="446" font-size="16" fill="#a6abb4" text-anchor="middle">any HDMI-CEC source</text>

  <!-- CEC wire into the TV -->
  <line x1="276" y1="425" x2="497" y2="425" stroke="#a6abb4" stroke-width="3" marker-end="url(#ah)"/>
  <text x="368" y="404" font-size="17" font-weight="600" fill="#a6abb4" text-anchor="middle">HDMI-CEC</text>
  <text x="368" y="456" font-size="15" fill="#6a6f78" text-anchor="middle">volume &#183; mute press</text>

  <!-- TV boundary -->
  <rect x="460" y="64" width="1180" height="528" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <text x="505" y="112" font-size="15" font-weight="600" fill="#6a6f78" letter-spacing="3">LG WEBOS TV &#8212; ROOTED</text>

  <!-- cec0 card -->
  <rect x="505" y="370" width="180" height="110" rx="18" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="595" y="410" font-size="22" font-weight="600" fill="#f5f6f8" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">/dev/cec0</text>
  <text x="595" y="436" font-size="16" fill="#a6abb4" text-anchor="middle">CEC adapter</text>
  <text x="595" y="459" font-size="13" fill="#6a6f78" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">0x44 &#183; 41 / 42 / 43</text>

  <!-- stock (dropped) branch -->
  <path d="M595 370 L595 210 Q595 196 609 196 L745 196" fill="none" stroke="#6a6f78" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#ahd)"/>
  <rect x="755" y="150" width="215" height="92" rx="18" fill="none" stroke="#6a6f78" stroke-opacity="0.55" stroke-dasharray="5 7" stroke-width="1.5"/>
  <text x="862" y="190" font-size="20" font-weight="600" fill="#a6abb4" text-anchor="middle">webOS CEC handler</text>
  <text x="862" y="218" font-size="15" fill="#6a6f78" text-anchor="middle">stock behavior</text>
  <line x1="970" y1="196" x2="1028" y2="196" stroke="#6a6f78" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#ahd)"/>
  <text x="1045" y="192" font-size="22" font-weight="600" fill="#e98b84">&#10005;  volume ops dropped</text>
  <text x="1045" y="220" font-size="16" fill="#6a6f78">never reach the input layer &#8212; no OSD, no volume change</text>

  <!-- bridge path -->
  <line x1="685" y1="425" x2="745" y2="425" stroke="#a6abb4" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="755" y="370" width="215" height="110" rx="18" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="862" y="406" font-size="23" font-weight="600" fill="#f5f6f8" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">cecvold</text>
  <text x="862" y="431" font-size="16" fill="#a6abb4" text-anchor="middle">root daemon</text>
  <text x="862" y="455" font-size="13" fill="#6a6f78" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">writes KEY 115 &#183; 114 &#183; 113</text>

  <line x1="970" y1="425" x2="1030" y2="425" stroke="#a6abb4" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="1040" y="370" width="235" height="110" rx="18" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="1157" y="412" font-size="21" font-weight="600" fill="#f5f6f8" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">/dev/input/eventN</text>
  <text x="1157" y="442" font-size="16" fill="#a6abb4" text-anchor="middle">input node webOS reads</text>

  <line x1="1275" y1="425" x2="1335" y2="425" stroke="#a6abb4" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="1345" y="370" width="250" height="110" rx="18" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="1470" y="404" font-size="21" font-weight="600" fill="#f5f6f8" text-anchor="middle">Native volume path</text>
  <text x="1470" y="430" font-size="16" fill="#a6abb4" text-anchor="middle">OSD &#183; repeat &#183; speakers</text>
  <rect x="1372" y="448" width="160" height="8" rx="4" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="1372" y="448" width="100" height="8" rx="4" fill="#f5f6f8"/>
  <text x="1560" y="457" font-size="15" fill="#a6abb4" text-anchor="end">34</text>

  <!-- legend -->
  <line x1="505" y1="552" x2="545" y2="552" stroke="#6a6f78" stroke-width="2.5" stroke-dasharray="5 7"/>
  <text x="557" y="557" font-size="15" fill="#6a6f78">stock webOS &#8212; volume frames dropped</text>
  <line x1="905" y1="552" x2="945" y2="552" stroke="#a6abb4" stroke-width="3"/>
  <text x="957" y="557" font-size="15" fill="#6a6f78">with Volume over CEC</text>
</svg>
