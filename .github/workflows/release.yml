name: release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build binaries (aarch64 + armv7l)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          aarch64-linux-gnu-gcc -O2 -static -o app/cecvold.aarch64 cecvold.c
          aarch64-linux-gnu-strip app/cecvold.aarch64
          arm-linux-gnueabihf-gcc -O2 -static -o app/cecvold.armv7l cecvold.c
          arm-linux-gnueabihf-strip app/cecvold.armv7l
          chmod +x app/cecvold app/cecvold.aarch64 app/cecvold.armv7l

      - name: Package ipk
        run: |
          npm install -g @webosose/ares-cli
          ares-package app/ -o .

      - name: Generate manifest
        run: |
          IPK=$(ls org.webosbrew.cecvold_*_all.ipk)
          VER=$(node -e "console.log(require('./app/appinfo.json').version)")
          SHA=$(sha256sum "$IPK" | awk '{print $1}')
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > org.webosbrew.cecvold.manifest.json <<JSON
          {
            "id": "org.webosbrew.cecvold",
            "version": "${VER}",
            "type": "web",
            "title": "Volume over CEC",
            "appDescription": "Apple TV volume over HDMI-CEC on LG webOS TV speakers, with the native OSD.",
            "iconUri": "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/app/icon.png",
            "sourceUrl": "https://github.com/${GITHUB_REPOSITORY}",
            "rootRequired": true,
            "ipkUrl": "${BASE}/${IPK}",
            "ipkHash": { "sha256": "${SHA}" }
          }
          JSON

      - name: Extract release notes from CHANGELOG
        run: |
          VER=$(node -e "console.log(require('./app/appinfo.json').version)")
          awk "/^## ${VER}\$/{f=1;next} /^## /{f=0} f" CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: org.webosbrew.cecvold-build
          path: |
            org.webosbrew.cecvold_*_all.ipk
            org.webosbrew.cecvold.manifest.json

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            org.webosbrew.cecvold_*_all.ipk
            org.webosbrew.cecvold.manifest.json
